name: Auto Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy Docker Container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "=========================================="
            echo "Memulai proses deploy otomatis di server..."
            echo "=========================================="
            
            # Masuk ke folder project di server
            cd "${{ secrets.SERVER_PATH }}"
            
            # Tarik kode terbaru dari GitHub
            echo "1. Menarik pembaruan dari branch main..."
            git fetch origin main
            git reset --hard origin/main
            
            # Jalankan docker compose (kompatibel dengan docker compose v2 maupun v1)
            echo "2. Membangun dan me-restart container Docker di port 8007..."
            if command -v docker &> /dev/null && docker compose version &> /dev/null; then
              docker compose down
              docker compose up -d --build
            else
              docker-compose down
              docker-compose up -d --build
            fi
            
            # Bersihkan image cache lama agar disk server tidak penuh
            docker image prune -f
            
            echo "=========================================="
            echo "Deploy selesai! Service aktif di port 8007."
            echo "=========================================="
