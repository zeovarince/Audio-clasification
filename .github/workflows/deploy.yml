name: Deploy SilentGuard Lab to the lab server

on:
  push:
    branches:
      - main

concurrency:
  group: silentguard-lab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pull and deploy on the lab server
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          command_timeout: 30m
          envs: SERVER_PATH
          script: |
            set -eu
            cd "$SERVER_PATH"
            git pull --ff-only origin main
            docker compose up --build --detach --remove-orphans

            attempt=0
            until docker compose exec -T backend python -c "import json, urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); assert d.get('status') == 'ok' and d.get('model_loaded') is True, d"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 30 ]; then
                docker compose logs --tail=100
                exit 1
              fi
              sleep 2
            done

            attempt=0
            until docker compose exec -T frontend node -e "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 30 ]; then
                docker compose logs --tail=100
                exit 1
              fi
              sleep 2
            done

            docker compose ps
